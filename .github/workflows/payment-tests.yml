
name: Payment First Fulfilment Tests

on:
  workflow_dispatch:
  push:
    branches:
      - weekly-deals
    paths:
      - 'src/modules/payments/**'
      - 'src/modules/zoho/**'
      - '.github/workflows/payment-tests.yml'

permissions:
  contents: read

jobs:
  payment-tests:
    name: Run Payment and Zoho Reconciliation Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run payment and Zoho reconciliation tests
        run: |
          npx jest --runInBand --runTestsByPath \
            src/modules/payments/payment-first-fulfilment.service.spec.ts \
            src/modules/zoho/zoho-inventory.service.spec.ts
